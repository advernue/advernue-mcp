name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # TEMPORARY: package.json depends on @advernue/sdk via file:../advernue-node.
      # Remove this step when the dependency is switched to the published semver range.
      - name: Build sibling @advernue/sdk
        run: |
          git clone --depth 1 https://github.com/advernue/advernue-node.git ../advernue-node
          cd ../advernue-node && pnpm install --frozen-lockfile && pnpm build
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
