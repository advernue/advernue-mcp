name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and build attestation; no NPM_TOKEN
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # TEMPORARY: package.json depends on @advernue/sdk via file:../advernue-node.
      # Remove this step when the dependency is switched to the published semver range.
      - name: Build sibling @advernue/sdk
        run: |
          git clone --depth 1 https://github.com/advernue/advernue-node.git ../advernue-node
          cd ../advernue-node && pnpm install --frozen-lockfile && pnpm build
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent --ignore-scripts)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pack.outputs.file }}
      - name: Publish
        run: npm publish "${{ steps.pack.outputs.file }}" --provenance --access public
